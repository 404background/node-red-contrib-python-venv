<script type="text/html" data-help-name="venv-config">
  <p>
    このノードではPythonの仮想環境の名前を設定し、作成することができます。
    絶対パスで指定することもできます。
  </p>
  <p>同じ名前の仮想環境を追加しても、作成される仮想環境は一つだけです。</p>
  <h3>既存の仮想環境を使う</h3>
  <p>
    指定したディレクトリが既にPythonの仮想環境である場合（<code>pyvenv.cfg</code>がある場合）、
    新しく作成せずにその環境を利用します。
    環境には何も書き込まず、システムのPythonやvenvモジュールも必要ないため、
    Node-RED外で<code>python -m venv</code>や<code>uv venv</code
    >で作成した環境をそのまま使えます。
    ディレクトリは存在するが仮想環境ではない場合は、何も作成せずエラーを報告します。
  </p>
  <h3>このノードを削除したとき</h3>
  <p>
    このノードを削除したとき、仮想環境が削除されるのは<b>このノードが作成した場合のみ</b>です。
    作成時に書き込まれるマーカーファイルで判別しているため、外部から取り込んだ環境が削除されることはありません。
  </p>
  <p>
    削除される場合も、仮想環境を構成するエントリとvenvノードが生成した<code>.py</code>ファイルだけが対象です。
    それ以外に置いたファイルは残り、フォルダ自体は空になった場合にのみ削除されます。
    対象となる絶対パスは下に表示され、仮想環境が削除されるノードを削除したときには警告が表示されます。
  </p>
  <h3>前提条件</h3>
  <p>
    仮想環境を新しく作成するには、<code>python3-venv</code> と
    <code>pip</code> がシステムにインストールされている必要があります。
    インストールされていない場合、設定ダイアログに警告が表示されます。
  </p>
  <ul>
    <li>
      <b>Debian/Ubuntu:</b>
      <code>sudo apt install python3-venv python3-pip</code>
    </li>
    <li>
      <b>Windows:</b>
      <a href="https://www.python.org/">python.org</a
      >からPythonをインストールしてください（Microsoft
      Store版にはvenvが含まれない場合があります）。
    </li>
  </ul>
  <h3>Pythonのバージョン</h3>
  <p>
    作成する仮想環境のPythonのバージョンを指定できます。
    Windowsでは<code>py</code>ランチャー（<code>py -3.11</code
    >）で、LinuxとmacOSでは
    バージョン付きのインタプリタ（<code>python3.11</code>）で選択されます。
    インストールされていない場合は警告を表示して既定の<code>python3</code>が使われます。
    予め利用したいバージョンのPythonをインストールしておいてください。
  </p>
</script>
