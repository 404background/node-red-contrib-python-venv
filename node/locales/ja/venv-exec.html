<script type="text/html" data-help-name="venv-exec">
  <p>
    Pythonの仮想環境のScriptsまたはbinフォルダにある実行ファイルを実行することができます。
  </p>
  <h3>モード</h3>
  <h4>List Executables：</h4>
  <p>
    Pythonの仮想環境のScriptsまたはbinフォルダにある実行ファイルの一覧が渡されます。
  </p>
  <p>実行するときにそのファイル名を指定してください。</p>
  <h4>Execute:</h4>
  <p>実行ファイルを実行します。引数も指定することができます。</p>
  <h3>出力</h3>
  <p>標準の<code>exec</code>ノードと同様に、3つの出力があります。</p>
  <ol class="node-ports">
    <li>
      <b>標準出力</b> &mdash;
      <code>msg.payload</code
      >に標準出力が入ります。実行が失敗した場合はここには何も送られないため、
      このポートにメッセージが来ることが成功を意味します。
    </li>
    <li>
      <b>標準エラー出力</b> &mdash;
      <code>msg.payload</code
      >に標準エラー出力が入ります。失敗時も含め、stderrに出力があった場合のみ送られるので、
      トレースバックをフロー内で処理できます。
    </li>
    <li>
      <b>返却コード</b> &mdash; <code>msg.payload</code>は<code
        >{ code: 0 }</code
      >のようなオブジェクトです。プロセスが強制終了された場合は<code>signal</code>が追加されます。
      プロセス終了時に必ず送られます。
    </li>
  </ol>
  <p>
    実行が失敗した場合はノードのエラーとしても報告されるため、既存の<code>catch</code>ノードはそのまま動作します。
  </p>
</script>
